name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --package commitor-cli --target ${{ matrix.target }}

      # Asset names must stay `commitor-{target-triple}` (+ `.exe` on
      # Windows) — engine::update::find_matching_asset matches on them.
      - name: Stage asset
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/commitor${ext}" \
             "commitor-${{ matrix.target }}${ext}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: commitor-${{ matrix.target }}*
