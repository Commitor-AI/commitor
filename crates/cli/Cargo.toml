[package]
name = "commitor-cli"
version = "0.2.0"
edition = "2021"
description = "Catches unrelated changes bundled into commits and splits them cleanly — whole-file or hunk-level, guided by AI analysis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Commitor-AI/commitor"
readme = "../../README.md"
keywords = ["git", "commit", "cli", "conventional-commits"]
categories = ["development-tools", "command-line-utilities"]

# The published crate is `commitor-cli` (the crates.io name `commitor`
# is taken), but the installed binary stays `commitor` so the
# user-facing command is unchanged.
[[bin]]
name = "commitor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
toml = "0.8"
rustyline = "18.0.1"

[dev-dependencies]
serde_json = "1"
