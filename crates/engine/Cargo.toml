[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Core engine for Commitor — detects unrelated changes in commits and PRs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
serde_json = "1"
